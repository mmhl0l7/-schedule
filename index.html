<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橋本将生 Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fff5f7;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .bg-pink-main { background-color: #ff4785; }
        .bg-pink-light { background-color: #ffe6ed; }
        .bg-pink-soft { background-color: #fff0f3; }
        .text-pink-main { color: #ff4785; }
        .border-pink-main { border-color: #ff4785; }
    </style>
</head>
<body class="pb-24">

    <!-- ヘッダー -->
    <header class="bg-white shadow-sm px-4 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <button class="text-pink-main font-bold p-1 bg-pink-light rounded-full">🔄</button>
            <h1 class="font-bold text-lg text-pink-main flex items-center gap-1">
                <span>🩷</span> 橋本将生 Schedule
            </h1>
        </div>
        <button class="bg-pink-light text-pink-main text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1">
            🔔 通知 <span class="w-2 h-2 bg-pink-main rounded-full inline-block"></span>
        </button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- カウントダウンバナー -->
        <div class="bg-pink-main text-white p-4 rounded-2xl shadow-md space-y-1">
            <div class="inline-block bg-white/20 text-xs px-2.5 py-0.5 rounded-full font-medium">
                🎬 映画公開カウントダウン
            </div>
            <div class="text-sm font-bold">
                映画『お姉ちゃんの翠くん』公開まであと <span id="countdown-days" class="text-lg underline">67</span> 日！ (12/4公開)
            </div>
        </div>

        <!-- プロフィールカード -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-pink-100 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-pink-light rounded-full flex items-center justify-center text-xl shadow-inner">
                    💖
                </div>
                <div>
                    <h2 class="font-bold text-gray-800">橋本将生 (Masaki Hashimoto)</h2>
                    <p class="text-xs text-gray-400">プロフィール＆関連リンクまとめ</p>
                </div>
            </div>
            <button onclick="alert('プロフィールリンクはここに表示されます')" class="text-pink-main text-xs font-bold border border-pink-main px-3 py-1.5 rounded-full">
                開く ▼
            </button>
        </div>

        <!-- 大カテゴリタブ -->
        <div class="flex bg-white p-1 rounded-2xl shadow-sm justify-around text-xs font-bold text-gray-500">
            <button class="flex-1 py-2 text-center rounded-xl bg-pink-main text-white shadow-sm transition">MAGAZINE</button>
            <button class="flex-1 py-2 text-center rounded-xl hover:bg-pink-soft transition">番組/映画</button>
            <button class="flex-1 py-2 text-center rounded-xl hover:bg-pink-soft transition">イベント</button>
            <button class="flex-1 py-2 text-center rounded-xl hover:bg-pink-soft transition">ココマサキ</button>
        </div>

        <!-- フィルタータグ -->
        <div class="bg-white p-3 rounded-2xl shadow-sm space-y-2 text-xs">
            <div class="flex flex-wrap gap-1.5">
                <button onclick="filterTag('すべて')" class="filter-btn px-3 py-1.5 rounded-full bg-pink-main text-white font-bold transition">すべて</button>
                <button onclick="filterTag('橋本将生')" class="filter-btn px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 hover:bg-pink-light transition">橋本将生</button>
            </div>
            <div class="flex flex-wrap gap-1.5 pt-1 border-t border-gray-100">
                <button onclick="filterTag('予約受付中')" class="filter-btn px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 hover:bg-pink-light transition">予約受付中</button>
                <button onclick="filterTag('表紙')" class="filter-btn px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 hover:bg-pink-light transition">表紙</button>
                <button onclick="filterTag('発売中')" class="filter-btn px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 hover:bg-pink-light transition">発売中</button>
                <button onclick="filterTag('誕生日')" class="filter-btn px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 hover:bg-pink-light transition">誕生日</button>
            </div>
        </div>

        <!-- 表示切り替え (リスト / カレンダー) -->
        <div class="flex gap-2">
            <button id="view-list-btn" onclick="switchView('list')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-pink-main text-white shadow-sm">リスト</button>
            <button id="view-cal-btn" onclick="switchView('calendar')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-white text-gray-500 shadow-sm">カレンダー</button>
        </div>

        <!-- スケジュール一覧エリア (リストビュー) -->
        <div id="schedule-list" class="space-y-3">
            <!-- JavaScriptでここにスケジュールが動的に挿入されます -->
        </div>

        <!-- カレンダービュー (初期非表示) -->
        <div id="schedule-calendar" class="bg-white p-4 rounded-2xl shadow-sm hidden text-center">
            <h3 class="font-bold text-pink-main mb-2">2026年 10月</h3>
            <div class="grid grid-cols-7 gap-1 text-xs text-gray-500 mb-2 font-bold">
                <span class="text-red-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-blue-500">土</span>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-xs">
                <!-- カレンダーの日付セル -->
            </div>
        </div>

        <!-- フッターリンク -->
        <div class="text-center pt-4 pb-8">
            <a href="#" class="text-xs text-pink-main underline font-medium">© Masaki Schedule (ログアウト)</a>
        </div>
    </main>

    <!-- 新規追加ボタン (フローティング) -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center z-40 px-4">
        <button onclick="openAddModal()" class="bg-pink-main text-white font-bold text-sm px-6 py-3 rounded-full shadow-lg flex items-center gap-2 hover:opacity-90 transition">
            <span>＋ 新規スケジュール追加</span>
        </button>
    </div>

    <!-- 追加モーダル -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
            <h3 class="font-bold text-pink-main text-base">新規スケジュール追加</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-gray-500 mb-1 font-bold">日付</label>
                    <input type="date" id="input-date" class="w-full border border-gray-200 rounded-lg p-2.5 outline-none focus:border-pink-main">
                </div>
                <div>
                    <label class="block text-gray-500 mb-1 font-bold">タイトル</label>
                    <input type="text" id="input-title" placeholder="例: J Movie Magazine 表紙" class="w-full border border-gray-200 rounded-lg p-2.5 outline-none focus:border-pink-main">
                </div>
                <div>
                    <label class="block text-gray-500 mb-1 font-bold">タグ (カンマ区切り 例: 予約受付中,表紙)</label>
                    <input type="text" id="input-tags" placeholder="予約受付中,表紙,橋本将生" class="w-full border border-gray-200 rounded-lg p-2.5 outline-none focus:border-pink-main">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeAddModal()" class="flex-1 bg-gray-100 text-gray-600 font-bold py-2.5 rounded-xl text-xs">キャンセル</button>
                <button onclick="saveNewSchedule()" class="flex-1 bg-pink-main text-white font-bold py-2.5 rounded-xl text-xs shadow-sm">追加する</button>
            </div>
        </div>
    </div>

    <script>
        // 初期スケジュールデータ
        let schedules = JSON.parse(localStorage.getItem('oshi_schedules')) || [
            { id: 1, date: '2026-10-01', title: 'J Movie Magazine Vol.135 (表紙) ▼', tags: ['予約受付中', '表紙', '橋本将生'] },
            { id: 2, date: '2026-10-17', title: '誕生日 ▼', tags: ['誕生日', '橋本将生'] }
        ];

        let currentFilter = 'すべて';
        let currentViewMode = 'list';

        function renderSchedules() {
            const listEl = document.getElementById('schedule-list');
            listEl.innerHTML = '';

            let filtered = schedules;
            if (currentFilter !== 'すべて') {
                filtered = schedules.filter(item => item.tags.includes(currentFilter));
            }

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="text-center py-8 text-gray-400 text-xs">該当するスケジュールはありません</div>';
                return;
            }

            filtered.forEach(item => {
                let tagsHtml = item.tags.map(tag => `<span class="bg-pink-soft text-pink-main text-[10px] px-2.5 py-1 rounded-full font-medium">${tag}</span>`).join('');
                
                let card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-2xl shadow-sm border border-pink-100 space-y-3';
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <span class="bg-pink-light text-pink-main font-bold px-2.5 py-1 rounded-md flex items-center gap-1">
                            📅 ${item.date}
                        </span>
                        <span class="text-gray-400 text-[11px] border border-gray-200 px-2.5 py-0.5 rounded-full">○ 管理ステータス</span>
                    </div>
                    <div class="font-bold text-gray-800 text-sm">
                        ${item.title}
                    </div>
                    <div class="border-t border-dashed border-gray-100 pt-3 flex justify-between items-center">
                        <div class="flex flex-wrap gap-1">${tagsHtml}</div>
                        <div class="flex gap-1.5 text-xs">
                            <button onclick="deleteSchedule(${item.id})" class="text-red-400 bg-red-50 px-2.5 py-1 rounded-md font-medium hover:bg-red-100">削除 ✕</button>
                        </div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function filterTag(tag) {
            currentFilter = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.innerText === tag) {
                    btn.className = 'filter-btn px-3 py-1.5 rounded-full bg-pink-main text-white font-bold transition';
                } else {
                    btn.className = 'filter-btn px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 hover:bg-pink-light transition';
                }
            });
            renderSchedules();
        }

        function switchView(mode) {
            currentViewMode = mode;
            const listEl = document.getElementById('schedule-list');
            const calEl = document.getElementById('schedule-calendar');
            const listBtn = document.getElementById('view-list-btn');
            const calBtn = document.getElementById('view-cal-btn');

            if (mode === 'list') {
                listEl.classList.remove('hidden');
                calEl.classList.add('hidden');
                listBtn.className = 'px-4 py-1.5 rounded-full text-xs font-bold bg-pink-main text-white shadow-sm';
                calBtn.className = 'px-4 py-1.5 rounded-full text-xs font-bold bg-white text-gray-500 shadow-sm';
            } else {
                listEl.classList.add('hidden');
                calEl.classList.remove('hidden');
                calBtn.className = 'px-4 py-1.5 rounded-full text-xs font-bold bg-pink-main text-white shadow-sm';
                listBtn.className = 'px-4 py-1.5 rounded-full text-xs font-bold bg-white text-gray-500 shadow-sm';
                renderCalendarGrid();
            }
        }

        function renderCalendarGrid() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            // 2026年10月の簡易カレンダー描画 (10月1日は木曜・全31日)
            // 空白セル (木曜日スタートなので日〜水まで4マス空ける)
            for (let i = 0; i < 4; i++) {
                grid.innerHTML += `<div></div>`;
            }
            for (let day = 1; day <= 31; day++) {
                let dateStr = `2026-10-${day < 10 ? '0' + day : day}`;
                let hasEvent = schedules.some(s => s.date === dateStr);
                let bgClass = hasEvent ? 'bg-pink-main text-white font-bold rounded-full' : 'hover:bg-gray-100 rounded-full py-1';
                grid.innerHTML += `<div class="py-1.5 flex flex-col items-center justify-center ${bgClass}">${day}</div>`;
            }
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
        }

        function saveNewSchedule() {
            const date = document.getElementById('input-date').value;
            const title = document.getElementById('input-title').value;
            const tagsInput = document.getElementById('input-tags').value;

            if (!date || !title) {
                alert('日付とタイトルを入力してください！');
                return;
            }

            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : ['推し活'];

            const newId = schedules.length > 0 ? Math.max(...schedules.map(s => s.id)) + 1 : 1;
            schedules.push({ id: newId, date, title, tags });
            
            localStorage.setItem('oshi_schedules', JSON.stringify(schedules));

            document.getElementById('input-date').value = '';
            document.getElementById('input-title').value = '';
            document.getElementById('input-tags').value = '';

            closeAddModal();
            renderSchedules();
        }

        function deleteSchedule(id) {
            if (confirm('このスケジュールを削除しますか？')) {
                schedules = schedules.filter(s => s.id !== id);
                localStorage.setItem('oshi_schedules', JSON.stringify(schedules));
                renderSchedules();
            }
        }

        // 初期描画
        renderSchedules();
    </script>
</body>
</html>
