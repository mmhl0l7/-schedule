<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>橋本将生 Schedule</title>
  <style>
    :root {
      --pastel-base: #fdf6f9;
      --main-color: #ff69b4;
      --deep-color: #d81b60;
      --border-color: #fce4ec;
      --card-bg: #ffffff;
      --tag-bg: #fff0f5;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--pastel-base);
      margin: 0;
      padding: 10px;
      color: #333;
    }
    .app-container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .checkbox-row-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .checkbox-row-container label {
      font-size: 11px;
      font-weight: normal;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #fff0f5;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }
    .checkbox-row-container input[type="checkbox"] {
      margin: 0;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .profile-card { background: #fff; border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; margin-bottom: 12px; position: relative; }
    .profile-summary-bar { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .profile-header { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .profile-avatar { width: 45px; height: 45px; background: #fce4ec; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid var(--main-color); flex-shrink: 0; }
    .profile-name-area { min-width: 0; }
    .profile-name-area h2 { font-size: 14px; color: var(--deep-color); margin: 0 0 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-name-area p { font-size: 11px; color: #666; margin: 0; }
    .accordion-toggle-icon { font-size: 11px; font-weight: bold; color: var(--deep-color); background: var(--tag-bg); padding: 4px 8px; border-radius: 12px; border: 1px solid #f8bbd0; flex-shrink: 0; }
    .profile-collapsible-content { display: none; margin-top: 12px; border-top: 1px dashed var(--border-color); padding-top: 10px; position: relative; }
    .profile-collapsible-content.open { display: block; }
    .profile-edit-trigger { display: none; position: absolute; top: 10px; right: 0; background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .profile-edit-trigger.show { display: block; }

    .profile-links-grid { display: flex; flex-direction: column; gap: 12px; }
    .profile-section-block { background: #faf5f7; border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; }
    .profile-section-title { font-size: 12px; font-weight: bold; color: var(--deep-color); margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    .profile-link-buttons-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
    .profile-link-btn { font-size: 11px; background: #fff; color: #555; border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    .profile-link-btn:hover { background: var(--tag-bg); color: var(--deep-color); border-color: var(--main-color); }

    .today-topic-card { background: linear-gradient(135deg, #ff80ab, #ff4081); color: #fff; border-radius: 16px; padding: 12px 16px; margin-bottom: 12px; }
    .topic-label { font-size: 10px; background: rgba(255,255,255,0.3); padding: 2px 8px; border-radius: 10px; display: inline-block; font-weight: bold; margin-bottom: 4px; }
    .topic-title { font-size: 13px; font-weight: bold; line-height: 1.4; }

    .header-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .app-title-text { font-size: 15px; font-weight: bold; color: var(--deep-color); }
    .notification-status-badge { background: #fff; border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 14px; font-size: 11px; font-weight: bold; color: var(--deep-color); }

    .type-tabs { display: flex; background: #f8bbd0; border-radius: 24px; padding: 4px; margin-bottom: 12px; }
    .type-tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; font-weight: bold; color: #880e4f; border-radius: 20px; cursor: pointer; background: transparent; border: none; }
    .type-tab.active { background: #ffffff; color: var(--deep-color); box-shadow: 0 2px 6px rgba(216, 27, 96, 0.2); }

    .month-nav-container { display: flex; gap: 8px; margin-bottom: 12px; }
    .month-nav { flex: 1; display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid var(--border-color); border-radius: 20px; padding: 6px 12px; font-weight: bold; color: var(--deep-color); }
    .month-nav button { background: var(--tag-bg); border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; color: var(--deep-color); font-weight: bold; }
    .today-jump-btn { background: #fff; border: 1px solid var(--main-color); color: var(--deep-color); padding: 0 14px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }

    .filter-section { background: #fff; border: 1px solid var(--border-color); border-radius: 16px; padding: 10px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .filter-pill { font-size: 11px; padding: 4px 10px; border-radius: 14px; border: 1px solid var(--border-color); background: #fff; color: #555; cursor: pointer; font-weight: bold; }
    .filter-pill.active { background: var(--deep-color); color: #fff; border-color: var(--deep-color); }

    .view-mode-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .view-switch { display: flex; background: #fce4ec; border-radius: 16px; padding: 3px; }
    .view-btn { font-size: 11px; padding: 5px 12px; border-radius: 14px; border: none; background: transparent; color: var(--deep-color); font-weight: bold; cursor: pointer; }
    .view-btn.active { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

    .item-card { background: var(--card-bg); border: 1px solid #f8bbd0; border-radius: 16px; padding: 12px; margin-bottom: 10px; }
    .item-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
    .item-title { font-size: 14px; font-weight: bold; color: #222; flex: 1; }
    .purchase-status-badge { font-size: 10px; padding: 4px 8px; border-radius: 12px; border: 1px solid #ccc; background: #f8f9fa; color: #555; cursor: pointer; font-weight: bold; white-space: nowrap; }
    .purchase-status-badge.done { background: #e2f0d9; color: #385723; border-color: #b7e1cd; }
    .item-footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; flex-wrap: wrap; gap: 6px; }
    .badges-left { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .status-tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; color: #fff; font-weight: bold; background: #ff69b4; }
    .member-tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: #fff0f5; color: var(--deep-color); border: 1px solid #f8bbd0; font-weight: bold; }
    .date-range-display { font-size: 10px; color: #666; background: #fdf0f5; padding: 2px 6px; border-radius: 6px; border: 1px dashed var(--main-color); margin-bottom: 6px; display: inline-block; }
    .shop-link-btn { font-size: 10px; background: #fff0f5; color: var(--deep-color); border: 1px solid var(--main-color); padding: 3px 8px; border-radius: 10px; text-decoration: none; font-weight: bold; }

    .item-action-icons { display: none; gap: 5px; }
    .item-action-icons.show { display: flex; }
    .icon-btn { background: #f9f9fc; border: 1px solid var(--border-color); padding: 3px 8px; border-radius: 10px; font-size: 11px; cursor: pointer; font-weight: bold; }
    .edit-icon-btn { background: #e3f2fd; color: #1565c0; border-color: #bbdefb; }
    .delete-icon-btn { background: #ffebee; color: #c62828; border-color: #ffcdd2; }

    .form-container { display: none; background: #fff; border: 2px solid var(--main-color); border-radius: 16px; padding: 14px; margin-bottom: 16px; }
    .form-group { margin-bottom: 8px; }
    .form-group label { font-size: 11px; font-weight: bold; color: var(--deep-color); display: block; margin-bottom: 2px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 6px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 12px; }
    .submit-btn { background: var(--main-color); color: #fff; border: none; width: 100%; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .cancel-edit-btn { background: #ccc; color: #fff; border: none; width: 100%; padding: 6px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 4px; font-size: 11px; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; background: #fff; padding: 8px; border-radius: 16px; border: 1px solid var(--border-color); }
    .cal-cell { min-height: 55px; border: 1px solid #eee; border-radius: 6px; padding: 2px; font-size: 9px; background: #fafafa; overflow: hidden; cursor: pointer; }
    .cal-cell.has-event { background: #fff0f5; border-color: var(--main-color); }
    .cal-cell.is-today { background: #ffe4ec !important; border: 2px solid var(--deep-color) !important; }
    .cal-day-num { font-weight: bold; color: #444; margin-bottom: 2px; display: inline-block; }
    .no-data { text-align: center; color: #888; font-size: 12px; padding: 20px; background: #fff; border-radius: 12px; }

    .footer-admin-area { text-align: center; margin: 30px 0 15px 0; }
    .admin-footer-btn { background: none; border: none; color: #bbb; font-size: 10px; cursor: pointer; text-decoration: underline; padding: 5px; }
    .admin-footer-btn.logged-in { color: var(--deep-color); font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>

<div class="app-container" id="app-root">
  <div class="header-top-bar">
    <div class="app-title-text">🩷 橋本将生 Schedule</div>
    <div class="notification-status-badge">🔔 通知: 稼働中</div>
  </div>

  <div class="today-topic-card" id="today-topic-box">
    <div class="topic-label" id="topic-label">✨ 映画公開カウントダウン</div>
    <div class="topic-title" id="topic-text">読み込み中...</div>
  </div>

  <div class="profile-card">
    <div class="profile-summary-bar" onclick="toggleProfileAccordion()">
      <div class="profile-header">
        <div class="profile-avatar" id="pf-avatar-icon">🩷</div>
        <div class="profile-name-area">
          <h2 id="pf-display-name">橋本将生 (Masaki Hashimoto)</h2>
          <p id="pf-display-sub">プロフィール＆関連リンクまとめ</p>
        </div>
      </div>
      <div class="accordion-toggle-icon" id="accordion-toggle-text">開く ▼</div>
    </div>

    <div class="profile-collapsible-content" id="profile-collapsible-area">
      <button class="profile-edit-trigger" id="profile-edit-btn" onclick="openProfileEditModal()">✏️ プロフィール編集</button>
      <div class="profile-links-grid" id="profile-links-container"></div>
    </div>
  </div>

  <div class="form-container" id="profile-form">
    <div style="font-size: 13px; font-weight: bold; color: var(--deep-color); margin-bottom: 8px;">✏️ プロフィール・リンク編集</div>
    <div class="form-group"><label>名前</label><input type="text" id="input-pf-name" value="橋本将生 (Masaki Hashimoto)"></div>
    <div class="form-group"><label>サブタイトル</label><input type="text" id="input-pf-sub" value="プロフィール＆関連リンクまとめ"></div>
    <div class="form-group"><label>アイコン</label><input type="text" id="input-pf-icon" value="🩷"></div>
    <div class="form-group">
      <label>リンク設定 (カテゴリ: 名前=URL形式を改行区切り)</label>
      <textarea id="input-pf-links" rows="8"></textarea>
    </div>
    <button class="submit-btn" onclick="saveProfileData()">更新する</button>
    <button class="cancel-edit-btn" onclick="document.getElementById('profile-form').style.display='none'">キャンセル</button>
  </div>

  <div class="type-tabs">
    <button class="type-tab active" id="tab-magazine" onclick="switchMainType('MAGAZINE')">MAGAZINE</button>
    <button class="type-tab" id="tab-program" onclick="switchMainType('PROGRAM')">出演番組</button>
  </div>

  <div class="month-nav-container">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">&lt;</button>
      <span id="month-display">2026年10月</span>
      <button onclick="changeMonth(1)">&gt;</button>
    </div>
    <button class="today-jump-btn" onclick="jumpToCurrentMonth()">🔄 今月</button>
  </div>

  <div class="filter-section">
    <div class="filter-row" id="member-filters">
      <button class="filter-pill active" onclick="toggleMemberFilter('すべて')">すべて</button>
      <button class="filter-pill" onclick="toggleMemberFilter('橋本将生')">橋本将生</button>
    </div>
    <div class="filter-row" id="status-filters"></div>
  </div>

  <div class="view-mode-bar">
    <div class="view-switch">
      <button class="view-btn active" id="view-list-btn" onclick="switchView('list')">リスト</button>
      <button class="view-btn" id="view-cal-btn" onclick="switchView('calendar')">カレンダー</button>
    </div>
  </div>

  <div class="form-container" id="admin-form">
    <div style="font-size: 13px; font-weight: bold; color: var(--deep-color); margin-bottom: 8px;" id="form-heading-text">📖 スケジュール追加</div>
    <input type="hidden" id="edit-item-id" value="">
    
    <div class="form-group"><label>日付</label><input type="date" id="input-date"></div>
    <div class="form-group" id="group-end-date" style="display:none;"><label>終了日</label><input type="date" id="input-end-date"></div>
    <div class="form-group" id="group-time"><label>時間</label><input type="time" id="input-time" value="20:00"></div>
    <div class="form-group"><label>タイトル</label><input type="text" id="input-title" placeholder="雑誌名または番組名"></div>
    <div class="form-group">
      <label>カテゴリ</label>
      <select id="input-type" onchange="onFormTypeChange()">
        <option value="MAGAZINE">MAGAZINE</option>
        <option value="PROGRAM">出演番組</option>
      </select>
    </div>
    <div class="form-group">
      <label>ステータス（複数選択可）</label>
      <div id="input-status-container" class="checkbox-row-container"></div>
    </div>
    <div class="form-group">
      <label>関連リンク</label><input type="text" id="input-links" placeholder="例: Amazon:https://...">
    </div>
    <button class="submit-btn" id="form-submit-btn" onclick="saveItemData()">登録する</button>
    <button class="cancel-edit-btn" id="form-cancel-btn" style="display:none;" onclick="resetFormToCreateMode()">キャンセル</button>
  </div>

  <div id="content-area"></div>

  <div class="footer-admin-area">
    <button class="admin-footer-btn" id="admin-toggle-btn" onclick="checkAdminAndToggleForm()">⚙️ 管理者ログイン</button>
  </div>
</div>

<script>
  const realNow = new Date();
  let currentYear = realNow.getFullYear();
  let currentMonth = realNow.getMonth();

  let currentMainType = "MAGAZINE";
  let currentMemberFilters = ["すべて"];
  let currentStatusFilters = ["すべて"];
  let currentViewMode = "list";
  let isAdminLoggedIn = false;

  let profileData = {
    name: "橋本将生 (Masaki Hashimoto)",
    sub: "プロフィール＆関連リンクまとめ",
    icon: "🩷",
    sections: [
      {
        category: "🎬 映画・出演",
        links: [
          {name: "映画『お姉ちゃんの翠くん』主演・雪代翠 役 (12/4公開)", url: "#"}
        ]
      },
      {
        category: "🌟 アンバサダー・CM",
        links: [
          {name: "ジェルネイル『Gelee by Decorative Nail』アンバサダー", url: "#"},
          {name: "森永乳業『クラフト フレッシュモッツァレラ』アンバサダー", url: "#"}
        ]
      },
      {
        category: "📱 SNS・公式リンク",
        links: [
          {name: "Instagram", url: "https://instagram.com"},
          {name: "FAMILY CLUB web (いまさっきのまさき)", url: "https://www.fc-web.com"},
          {name: "X (旧Twitter)", url: "https://x.com"}
        ]
      }
    ]
  };

  let itemsData = [
    { 
      id: 1, type: "MAGAZINE", date: "2026-10-01", endDate: "", time: "", title: "J Movie Magazine Vol.135 (表紙)", status: ["表紙"], member: "橋本将生", 
      links: [{name: "Amazon", url: "https://amazon.co.jp"}], 
      purchased: false 
    }
  ];

  document.getElementById("month-display").textContent = `${currentYear}年${currentMonth + 1}月`;

  window.addEventListener('load', () => {
    renderProfileCard();
    updateStatusFilterPills();
    updateFormStatusOptions();
    updateFormVisibilityBytype();
    updateTodayTopic();
  });

  function toggleProfileAccordion() {
    const area = document.getElementById("profile-collapsible-area");
    const toggleText = document.getElementById("accordion-toggle-text");
    if (area.classList.contains("open")) {
      area.classList.remove("open");
      toggleText.textContent = "開く ▼";
    } else {
      area.classList.add("open");
      toggleText.textContent = "閉じる ▲";
    }
  }

  function renderProfileCard() {
    document.getElementById("pf-display-name").textContent = profileData.name;
    document.getElementById("pf-display-sub").textContent = profileData.sub;
    document.getElementById("pf-avatar-icon").textContent = profileData.icon;

    const container = document.getElementById("profile-links-container");
    container.innerHTML = "";

    profileData.sections.forEach(sec => {
      let block = document.createElement("div");
      block.className = "profile-section-block";
      
      let titleDiv = document.createElement("div");
      titleDiv.className = "profile-section-title";
      titleDiv.textContent = sec.category;
      block.appendChild(titleDiv);

      let wrapDiv = document.createElement("div");
      wrapDiv.className = "profile-link-buttons-wrap";

      sec.links.forEach(l => {
        let a = document.createElement("a");
        a.href = l.url;
        a.target = "_blank";
        a.className = "profile-link-btn";
        a.textContent = l.name;
        wrapDiv.appendChild(a);
      });
      block.appendChild(wrapDiv);
      container.appendChild(block);
    });
  }

  function openProfileEditModal() {
    document.getElementById("input-pf-name").value = profileData.name;
    document.getElementById("input-pf-sub").value = profileData.sub;
    document.getElementById("input-pf-icon").value = profileData.icon;

    let textLines = [];
    profileData.sections.forEach(sec => {
      let linksStr = sec.links.map(l => `${l.name}=${l.url}`).join(", ");
      textLines.push(`${sec.category}: ${linksStr}`);
    });
    document.getElementById("input-pf-links").value = textLines.join("\n");
    document.getElementById("profile-form").style.display = "block";
  }

  function saveProfileData() {
    profileData.name = document.getElementById("input-pf-name").value;
    profileData.sub = document.getElementById("input-pf-sub").value;
    profileData.icon = document.getElementById("input-pf-icon").value;

    let rawText = document.getElementById("input-pf-links").value;
    let newSections = [];

    rawText.split("\n").forEach(line => {
      line = line.trim();
      if (!line) return;
      if (line.includes(":")) {
        let colonIdx = line.indexOf(":");
        let cat = line.substring(0, colonIdx).trim();
        let rest = line.substring(colonIdx + 1).trim();
        let links = [];

        rest.split(",").forEach(itemPart => {
          itemPart = itemPart.trim();
          if (!itemPart) return;
          if (itemPart.includes("=")) {
            let eqIdx = itemPart.indexOf("=");
            links.push({ name: itemPart.substring(0, eqIdx).trim(), url: itemPart.substring(eqIdx + 1).trim() });
          } else {
            links.push({ name: itemPart, url: itemPart });
          }
        });
        newSections.push({ category: cat, links: links });
      }
    });

    if (newSections.length > 0) profileData.sections = newSections;
    renderProfileCard();
    document.getElementById("profile-form").style.display = "none";
    alert("プロフィールを更新しました！");
  }

  function switchMainType(type) {
    currentMainType = type;
    currentStatusFilters = ["すべて"];
    document.getElementById("tab-magazine").classList.toggle("active", type === "MAGAZINE");
    document.getElementById("tab-program").classList.toggle("active", type === "PROGRAM");
    
    updateStatusFilterPills();
    if (!document.getElementById("edit-item-id").value) {
      document.getElementById("input-type").value = type;
      updateFormStatusOptions();
      updateFormVisibilityBytype();
    }
    render();
  }

  function onFormTypeChange() {
    updateFormStatusOptions();
    updateFormVisibilityBytype();
  }

  function updateFormVisibilityBytype() {
    const typeSelect = document.getElementById("input-type");
    const targetType = typeSelect ? typeSelect.value : currentMainType;
    document.getElementById("group-time").style.display = targetType === "MAGAZINE" ? "none" : "block";
    document.getElementById("group-end-date").style.display = targetType === "MAGAZINE" ? "none" : "block";
  }

  function updateStatusFilterPills() {
    const container = document.getElementById("status-filters");
    container.innerHTML = "";
    let statuses = ["すべて"];
    if (currentMainType === "MAGAZINE") {
      statuses.push("予約受付中", "表紙", "発売中", "重版");
    } else {
      statuses.push("放送予定", "レギュラー", "ゲスト出演");
    }
    statuses.forEach(st => {
      const btn = document.createElement("button");
      btn.className = "filter-pill" + (currentStatusFilters.includes(st) ? " active" : "");
      btn.textContent = st;
      btn.onclick = () => toggleStatusFilter(st);
      container.appendChild(btn);
    });
  }

  function updateFormStatusOptions(selectedStatuses = []) {
    const typeSelect = document.getElementById("input-type");
    const targetType = typeSelect ? typeSelect.value : currentMainType;
    const statusContainer = document.getElementById("input-status-container");
    if (!statusContainer) return;
    
    statusContainer.innerHTML = "";
    let options = targetType === "MAGAZINE" ? ["予約受付中", "表紙", "発売中", "重版"] : ["放送予定", "ゲスト出演", "レギュラー"];
    let selectedArr = Array.isArray(selectedStatuses) ? selectedStatuses : [selectedStatuses];

    options.forEach(opt => {
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.name = "form-status-checkbox";
      checkbox.value = opt;
      if (selectedArr.includes(opt)) checkbox.checked = true;

      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(opt));
      statusContainer.appendChild(label);
    });
  }

  function changeMonth(dir) {
    currentMonth += dir;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    document.getElementById("month-display").textContent = `${currentYear}年${currentMonth + 1}月`;
    render();
  }

  function jumpToCurrentMonth() {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    document.getElementById("month-display").textContent = `${currentYear}年${currentMonth + 1}月`;
    render();
  }

  function toggleMemberFilter(member) {
    if (member === "すべて") {
      currentMemberFilters = ["すべて"];
    } else {
      if (currentMemberFilters.includes("すべて")) currentMemberFilters = [];
      let idx = currentMemberFilters.indexOf(member);
      if (idx > -1) currentMemberFilters.splice(idx, 1);
      else currentMemberFilters.push(member);
      if (currentMemberFilters.length === 0) currentMemberFilters = ["すべて"];
    }
    updateMultiPills("member-filters", currentMemberFilters);
    render();
  }

  function toggleStatusFilter(status) {
    if (status === "すべて") {
      currentStatusFilters = ["すべて"];
    } else {
      if (currentStatusFilters.includes("すべて")) currentStatusFilters = [];
      let idx = currentStatusFilters.indexOf(status);
      if (idx > -1) currentStatusFilters.splice(idx, 1);
      else currentStatusFilters.push(status);
      if (currentStatusFilters.length === 0) currentStatusFilters = ["すべて"];
    }
    updateStatusFilterPills();
    render();
  }

  function updateMultiPills(containerId, activeList) {
    const container = document.getElementById(containerId);
    Array.from(container.children).forEach(btn => {
      if (activeList.includes(btn.textContent)) btn.classList.add("active");
      else btn.classList.remove("active");
    });
  }

  function switchView(mode) {
    currentViewMode = mode;
    document.getElementById("view-list-btn").classList.toggle("active", mode === "list");
    document.getElementById("view-cal-btn").classList.toggle("active", mode === "calendar");
    render();
  }

  function updateTodayTopic() {
    const releaseDate = new Date("2026-12-04T00:00:00");
    const diffDays = Math.ceil((releaseDate - new Date()) / (1000 * 60 * 60 * 24));
    const topicEl = document.getElementById("topic-text");
    if (diffDays > 0) topicEl.textContent = `映画『お姉ちゃんの翠くん』公開まで あと ${diffDays} 日！ (12/4公開)`;
    else topicEl.textContent = `映画『お姉ちゃんの翠くん』大ヒット公開中！`;
  }

  function checkAdminAndToggleForm() {
    if (!isAdminLoggedIn) {
      const pwd = prompt("管理者パスワードを入力してください：");
      if (pwd === "masaki123") {
        isAdminLoggedIn = true;
        const btn = document.getElementById("admin-toggle-btn");
        btn.textContent = "⚙️ 管理者モード中";
        btn.classList.add("logged-in");
        document.getElementById("profile-edit-btn").classList.add("show");
        alert("管理者としてログインしました！");
        render();
      } else {
        if (pwd !== null) alert("パスワードが違います");
        return;
      }
    }
    const form = document.getElementById("admin-form");
    form.style.display = form.style.display === "block" ? "none" : "block";
    if (form.style.display === "block" && !document.getElementById("edit-item-id").value) resetFormToCreateMode();
  }

  function resetFormToCreateMode() {
    document.getElementById("edit-item-id").value = "";
    document.getElementById("form-heading-text").textContent = "📖 スケジュール追加";
    document.getElementById("form-submit-btn").textContent = "登録する";
    document.getElementById("form-cancel-btn").style.display = "none";
    document.getElementById("input-date").value = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`;
    document.getElementById("input-title").value = "";
    updateFormStatusOptions();
    updateFormVisibilityBytype();
  }

  function togglePurchase(id) {
    const item = itemsData.find(i => i.id === id);
    if (item) { item.purchased = !item.purchased; render(); }
  }

  function deleteItem(id) {
    if (!isAdminLoggedIn) return;
    if (confirm("削除しますか？")) {
      itemsData = itemsData.filter(i => i.id !== id);
      render();
    }
  }

  function parseLinks(inputStr) {
    if (!inputStr || !inputStr.trim()) return [];
    let result = [];
    inputStr.split(",").forEach(part => {
      part = part.trim();
      if (!part) return;
      if (part.includes(":")) {
        let colonIdx = part.indexOf(":");
        result.push({ name: part.substring(0, colonIdx).trim(), url: part.substring(colonIdx + 1).trim() });
      } else {
        result.push({ name: "リンク", url: part });
      }
    });
    return result;
  }

  function saveItemData() {
    const editId = document.getElementById("edit-item-id").value;
    const date = document.getElementById("input-date").value;
    const type = document.getElementById("input-type").value;
    const title = document.getElementById("input-title").value;
    const status = Array.from(document.querySelectorAll('input[name="form-status-checkbox"]:checked')).map(cb => cb.value);

    if (!date || !title) { alert("日付とタイトルを入力してください"); return; }
    if (status.length === 0) { alert("ステータスを1つ以上選択してください"); return; }

    const parsedLinks = parseLinks(document.getElementById("input-links").value);

    if (editId) {
      const item = itemsData.find(i => i.id == editId);
      if (item) {
        item.date = date; item.title = title; item.type = type; item.status = status; item.links = parsedLinks;
      }
      alert("更新しました！");
    } else {
      itemsData.push({ id: Date.now(), type, date, endDate: "", time: "20:00", title, status, member: "橋本将生", links: parsedLinks, purchased: false });
      alert("追加しました！");
    }

    document.getElementById("admin-form").style.display = "none";
    resetFormToCreateMode();
    render();
  }

  function isItemInCurrentMonth(item) {
    let startDate = new Date(item.date);
    let monthStart = new Date(currentYear, currentMonth, 1);
    let monthEnd = new Date(currentYear, currentMonth + 1, 0);
    return startDate <= monthEnd && startDate >= monthStart;
  }

  function render() {
    const container = document.getElementById("content-area");
    container.innerHTML = "";

    let filtered = itemsData.filter(item => {
      if (item.type !== currentMainType) return false;
      if (!isItemInCurrentMonth(item)) return false;
      if (!currentStatusFilters.includes("すべて")) {
        let itemStatuses = Array.isArray(item.status) ? item.status : [item.status];
        if (!currentStatusFilters.some(st => itemStatuses.includes(st))) return false;
      }
      return true;
    });

    if (currentViewMode === "calendar") renderCalendarView(filtered, container);
    else renderListView(filtered, container);
  }

  function createCardHtml(item) {
    const purchaseText = item.purchased ? "✓ 完了/済" : "○ 管理ステータス";
    const purchaseClass = item.purchased ? "purchase-status-badge done" : "purchase-status-badge";
    let statusTagsHtml = (Array.isArray(item.status) ? item.status : [item.status]).map(st => `<span class="status-tag">${st}</span>`).join(" ");
    let linksHtml = (item.links || []).map(l => `<a href="${l.url}" target="_blank" class="shop-link-btn">🔗 ${l.name}</a>`).join(" ");

    return `
      <div class="item-card">
        <div class="item-header-row">
          <div class="item-title">${item.title}</div>
          <button class="${purchaseClass}" onclick="togglePurchase(${item.id})">${purchaseText}</button>
        </div>
        <div class="date-range-display">📅 発売日/時間: ${item.date}</div>
        <div class="item-footer-row">
          <div class="badges-left">
            ${statusTagsHtml}
            <span class="member-tag">橋本将生</span>
            ${linksHtml}
          </div>
          <div class="item-action-icons ${isAdminLoggedIn ? 'show' : ''}">
            <button class="icon-btn edit-icon-btn" onclick="editItem(${item.id})">編集✏️</button>
            <button class="icon-btn delete-icon-btn" onclick="deleteItem(${item.id})">削除✕</button>
          </div>
        </div>
      </div>
    `;
  }

  function editItem(id) {
    if (!isAdminLoggedIn) return;
    const item = itemsData.find(i => i.id === id);
    if (!item) return;

    document.getElementById("edit-item-id").value = item.id;
    document.getElementById("input-date").value = item.date;
    document.getElementById("input-title").value = item.title;
    document.getElementById("input-type").value = item.type;
    updateFormStatusOptions(item.status);
    updateFormVisibilityBytype();

    document.getElementById("input-links").value = (item.links || []).map(l => `${l.name}:${l.url}`).join(", ");
    document.getElementById("form-heading-text").textContent = "✏️ スケジュール編集";
    document.getElementById("form-submit-btn").textContent = "更新する";
    document.getElementById("form-cancel-btn").style.display = "block";
    document.getElementById("admin-form").style.display = "block";
  }

  function renderListView(data, container) {
    if (data.length === 0) { container.innerHTML = `<div class="no-data">該当する予定はありません</div>`; return; }
    data.sort((a, b) => a.date.localeCompare(b.date));
    data.forEach(item => {
      let wrapper = document.createElement("div");
      wrapper.innerHTML = createCardHtml(item);
      container.appendChild(wrapper.firstElementChild);
    });
  }

  function renderCalendarView(data, container) {
    const calWrapper = document.createElement("div");
    calWrapper.className = "calendar-grid";
    ["日", "月", "火", "水", "木", "金", "土"].forEach(w => {
      let wEl = document.createElement("div");
      wEl.style.textAlign = "center"; wEl.style.fontWeight = "bold"; wEl.style.fontSize = "10px"; wEl.style.color = "var(--deep-color)";
      wEl.textContent = w;
      calWrapper.appendChild(wEl);
    });

    const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) calWrapper.appendChild(document.createElement("div"));

    for (let day = 1; day <= totalDays; day++) {
      const cell = document.createElement("div");
      cell.className = "cal-cell";
      const numEl = document.createElement("div");
      numEl.className = "cal-day-num";
      numEl.textContent = day;
      cell.appendChild(numEl);
      calWrapper.appendChild(cell);
    }
    container.appendChild(calWrapper);
  }

  document.getElementById("input-date").value = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`;
  render();
</script>

</body>
</html>
